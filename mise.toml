[tools]
bun = "1.4.2"

[tasks.build]
description = "Generate sing-box rules from the canonical Clash catalog"
run = "bun scripts/build-singbox.mjs"

[tasks.check]
description = "Validate generated output and service routing boundaries"
run = ["bun scripts/build-singbox.mjs --check", "bun scripts/check-service-routing.mjs"]
