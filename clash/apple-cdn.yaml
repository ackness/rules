# Apple download/static CDN hosts, reviewed 2026-11-14.
# Source: https://support.apple.com/en-us/101555 and existing Apple CN snapshots.
# Use before apple-cn-domain/apple-domain; default DIRECT with local DNS.
# Do not extend this to apple.com, cdn-apple.com, aaplimg.com or shared CDN parents.
payload:
