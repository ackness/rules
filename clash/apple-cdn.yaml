  - +.mzstatic.com
  - +.iosapps.itunes.apple.com
  - iosapps.itunes.g.aaplimg.com
  - +.osxapps.itunes.apple.com
  - osxapps.itunes.g.aaplimg.com

  # OS updates, restore images and dedicated delivery aliases.
  - +.appldnld.apple.com
  - appldnld.apple.com.edgesuite.net
  - appldnld.g.aaplimg.com
  - +.oscdn.apple.com
  - oscdn.origin-apple.com.akadns.net
  - +.swcdn.apple.com
  - swcdn.g.aaplimg.com
  - +.swdownload.apple.com
  - +.updates.cdn-apple.com
  - +.updates-http.cdn-apple.com
  - updates-http.cdn-apple.com.akadns.net

  # Xcode components and developer downloads; login hosts remain separate.
  - +.adcdownload.apple.com
  - adcdownload.apple.com.akadns.net
  - +.download.developer.apple.com
  - +.devimages-cdn.apple.com

  # GarageBand, Swift Playgrounds, screen savers and wallpapers.
